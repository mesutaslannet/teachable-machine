<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gözlük Tanıma Yapay Zekası</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">

    <h2>Gözlük Tanıma Modelim</h2>
    <p>Kamerayı başlat butonuna basarak yapay zekayı test edebilirsiniz.</p>
    
    <button type="button" onclick="init()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px;">Kamerayı Başlat</button>
    
    <div id="webcam-container" style="margin-top: 20px;"></div>
    <div id="label-container" style="margin-top: 20px; font-size: 24px; font-weight: bold; color: #333;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // Senin buluta yüklediğin modelin linki
        const URL = "https://teachablemachine.withgoogle.com/models/RmnaYpEAx/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // Modeli yükle
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Kamerayı ayarla ve başlat
                const flip = true; 
                webcam = new tmImage.Webcam(300, 300, flip); // Kamera boyutu 300x300
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                // Kamerayı ekrana yerleştir
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ""; // Başlamadan önce temizle
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
            } catch (error) {
                console.error("Hata detayı:", error);
                alert("Model yüklenemedi! Kamera izni vermemiş olabilirsin veya tarayıcı engelliyor olabilir.");
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                // Yüzdeleri tam sayı olarak göster
                const classPrediction = prediction[i].className + ": %" + (prediction[i].probability * 100).toFixed(0);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
